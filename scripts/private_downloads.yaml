# Free, official engine manuals for the PRIVATE shelf.
#
# These documents are free to download but copyrighted by their makers: they
# are never put in the public pack. scripts/fetch_private.py saves them under
# private/<group>/ for your own use. Only manufacturer sites, or owner
# associations re-hosting a maker's own document, are listed here.
#
# Resolver types:
#   url        direct link to a PDF
#   flowpaper  a FlowPaper viewer page; the PDF path is read from the page (Beta Marine)
#   page-pdfs  a web page; every PDF link matching `match` is downloaded (Westerbeke)
#   tohatsu    Tohatsu's owner's-manual catalogue (JSON), filtered by power and language
#
# Checked on 18 October 2026. Makers move files: a failed link is reported, not fatal.

volvo-penta-md2000:
  note: "Volvo Penta MD2010, MD2020, MD2030, MD2040 instruction book (1997)"
  items:
    - type: url
      name: MD2010-2040-instruction-book-EN-7738231-5.pdf
      url: "https://www.bavariayacht.org/downloads/engine/Volvo%20Owners_Manual-MD2010-20-30-40%207738231-5.pdf"
      host: Bavaria Yacht owners' association (re-host of the Volvo Penta document)
    - type: url
      name: MD2010-2040-manuel-instructions-FR.pdf
      url: "https://apps.hisse-et-oh.com/store/medias/sailing/5de/1ab/c93/original/5de1abc939819f37768c060f.pdf"
      host: Hisse et Oh (re-host of the Volvo Penta document)

